<p>Adapters are lightweight integrations that enable you to use
the AI SDK UI functions (<code>useChat</code> and <code>useCompletion</code>)
with 3rd party libraries.</p>
<p>The following adapters are currently available:</p>
<ul>
<li><a href="/v6/providers/adapters/langchain">LangChain</a></li>
<li><a href="/v6/providers/adapters/llamaindex">LlamaIndex</a></li>
</ul>
